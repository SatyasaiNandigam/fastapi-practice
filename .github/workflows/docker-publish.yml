name: Docker Build and Push

# 1. When should this run?
on:
  push:
    branches: [ "main" ]  # Runs every time you push to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.12.12'
    
      - name: Install dependencies
        run: |
            pip install -r requirements.txt

      - name: Run Tests
        run: |
            python -m pytest



  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest # 2. Use a fresh Linux VM provided by GitHub
    permissions:
        contents: read
        pull-requests: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
            context: .
            push: true
            # add versioning logic later
            tags: satyasainandigam1709/fastapi-practice-server:latest

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
            command: quickview
            image: satyasainandigam1709/fastapi-practice-server:latest

